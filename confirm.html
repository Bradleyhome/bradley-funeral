<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm Email - Bradley Funeral Committee</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0a0a0f;color:#e2e8f0;font-family:Inter,ui-sans-serif}</style>
</head>
<body class="min-h-screen grid place-items-center px-4">
<div class="w-full max-w-[560px] rounded-[20px] border bg-[#111827] p-8 text-center" style="border-color:#1f2937">
<div class="w-12 h-12 rounded-full grid place-items-center mx-auto mb-4" style="background:rgba(212,175,55,0.12);color:#d4af37">✓</div>
<h1 class="text-[22px] font-bold">Confirming your email...</h1>
<p id="msg" class="mt-3 text-[13px] leading-[1.6] text-[#94a3b8]">Please wait, verifying token with Google Sheets.</p>
<div id="box" class="mt-6 hidden rounded-xl border bg-[#0a0a0f] p-4 text-left text-[12px] leading-[1.6]" style="border-color:#1f2937"></div>
<a id="payBtn" href="#" class="hidden mt-6 inline-flex w-full items-center justify-center rounded-[12px] py-3.5 text-[13px] font-extrabold" style="background:#d4af37;color:#000">Pay KES 100 via Till 6282142 → Send Proof</a>
<div class="mt-6 text-[11px] text-[#64748b]">Ref BRADLEY locked 12 months • 5 Levels 10,4,3,2,1 • bradley.funeralcommittee@gmail.com</div>
</div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwB1W2ILjAvlJjTiZLTrXVWbis1KlsIOsNUuqVylq7JCo1UOoO8K7wWF3FkaG757k6E/exec";
(async()=>{
 const p=new URLSearchParams(location.search);
 const token=p.get("token");
 const msg=document.getElementById("msg");
 const box=document.getElementById("box");
 const pay=document.getElementById("payBtn");
 if(!token){ msg.textContent="❌ No token found in URL. Open the link from your email."; return; }
 msg.textContent="Verifying token: "+token.slice(0,8)+"...";
 try{
  const qs=new URLSearchParams({action:"verify",token}).toString();
  const res=await fetch(API_URL+"?"+qs);
  const text=await res.text();
  let data; try{ data=JSON.parse(text); }catch{ data={raw:text}; }
  if(data.ok||data.verified||text.toLowerCase().includes("verified")||text.toLowerCase().includes("success")){
   msg.innerHTML="✅ <b style='color:#22c55e'>Email confirmed!</b> You are now verified in Leads tab.";
   box.classList.remove("hidden");
   box.innerHTML=`Token: <b>${token}</b><br>Ref: ${(data.ref||"BRADLEY")} — 5 Levels locked 12 months<br><br><b>Next Step:</b><br>1. Pay KES 100 to M-Pesa Till <b>6282142</b><br>2. Or BTC 14At1v3TE8f5qGpbRRg85ricVTG2W6Doso<br>3. Send screenshot + Name + Ref to bradley.funeralcommittee@gmail.com<br><br>Your membership is now ACTIVE — welcome to the Chama ya Heshima.`;
   pay.classList.remove("hidden");
   pay.href="mailto:bradley.funeralcommittee@gmail.com?subject=Payment Proof - "+token;
  } else {
   msg.textContent="❌ Verification failed: "+(data.error||text.slice(0,120));
   box.classList.remove("hidden");
   box.textContent=JSON.stringify(data,null,2);
  }
 }catch(e){
  msg.textContent="❌ Network error: "+e.message+" — check exec URL is Anyone";
 }
})();
</script>
</body>
</html>
