  <!-- Bridge: React form ↔ Apps Script (Module 3) -->
  <script>
  (function () {
    var ref = new URLSearchParams(location.search).get("ref");
    if (ref) {
      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".refText").forEach(function (el) {
          el.textContent = ref.toUpperCase();
        });
      });
    }

    document.addEventListener("click", async function (e) {
      var btn = e.target.closest && e.target.closest("button");
      if (!btn) return;
      var panel = btn.closest("#access");
      if (!panel) return;
      var inputs = panel.querySelectorAll("input");
      if (inputs.length < 3) return;

      var fullName = inputs[0].value.trim();
      var phone    = inputs[1].value.trim();
      var email    = inputs[2].value.trim();
      if (!fullName || !phone) return;

      var sirName = window.Referral.extractSirName(fullName);
      try {
        var res = await window.Referral.registerMember({
          fullName: fullName,
          sirName: sirName,
          phone: phone,
          email: email || "",
          ref: window.Referral.getRefParam() || "BRADLEY"
        });
        if (res && res.ok) {
          console.log("✅ Registered:", res);
        } else if (res && res.taken) {
          alert("Sir name " + sirName + " is taken. Try: " + (res.suggestions || []).join(", "));
        } else {
          console.warn("Registration response:", res);
        }
      } catch (err) {
        console.warn("Referral API error:", err);
      }
    }, true);
  })();
  </script>
